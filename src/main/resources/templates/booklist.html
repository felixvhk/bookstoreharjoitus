<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Book List</title>

    <style>
        html {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            width: 45%;
        }

        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }

        th {
            background-color: rgb(180, 180, 180);
        }

        a {
            margin-right: 10px;
        }

        .edit-btn {
            color: blue;
        }
        .delete-btn {
            color: red;
        }

    </style>
</head>

<body>

<h1>Books</h1>

<p>
    <a href="/addbook">Add a new book</a>
</p>

<table>
    <thead>
    <tr>
        <th>Author</th>
        <th>Title</th>
        <th>ISBN</th>
        <th>Year</th>
        <th>Category</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.author}"></td>
        <td th:text="${book.title}"></td>
        <td th:text="${book.isbn}"></td>
        <td th:text="${book.publicationYear}"></td>
        <td th:text="${book.category.name}"></td>

        <td>
            <a class="edit-btn" th:href="@{/edit/{id}(id=${book.id})}">
                Edit
            </a>

            <a class="delete-btn" th:href="@{/delete/{id}(id=${book.id})}">
                Delete
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
