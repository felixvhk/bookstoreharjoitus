<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Book</title>

    <style>
        html {
            font-family: Arial, Helvetica, sans-serif;
        }

        label {
            display: inline-block;
            width: 150px;
            margin-bottom: 10px;
        }

        input {
            margin-bottom: 10px;
            padding: 5px;
        }
    </style>
</head>

<body>

<h1>Add a new book</h1>

<form th:action="@{/save}" th:object="${book}" method="post">

    <div>
        <label for="author">Author:</label>
        <input type="text"
               id="author"
               th:field="*{author}"
               required>
    </div>

    <div>
        <label for="title">Title:</label>
        <input type="text"
               id="title"
               th:field="*{title}"
               required>
    </div>

    <div>
        <label for="isbn">ISBN:</label>
        <input type="text"
               id="isbn"
               th:field="*{isbn}"
               required>
    </div>

    <div>
        <label for="publicationYear">Publication year:</label>
        <input type="number"
               id="publicationYear"
               th:field="*{publicationYear}"
               required>
    </div>

    <button type="submit">Save</button>

</form>

<p>
    <a href="/booklist">Back to book list</a>
</p>

</body>
</html>
